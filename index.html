<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TheoryPop 🍿</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #FFF5F1; 
            color: #4C0519; 
        }
        
        /* The signature 3D button physics */
        .btn-3d { 
            transition: transform 0.1s, box-shadow 0.1s; 
            border-radius: 20px; 
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-3d:active:not(:disabled) { 
            transform: translateY(6px); 
            box-shadow: 0 0px 0 0 transparent !important; 
        }

        /* Active Navigation Buttons */
        .btn-menu { background-color: #ffffff; border: 3px solid #FECDD3; box-shadow: 0 6px 0 0 #FDA4AF; color: #BE123C; }
        .btn-menu:hover:not(:disabled) { background-color: #FFF1F2; }
        
        /* Disabled / Coming Soon Buttons */
        .btn-disabled { 
            background-color: #F8FAFC; 
            border: 3px solid #E2E8F0; 
            box-shadow: 0 6px 0 0 #CBD5E1; 
            color: #94A3B8; 
            cursor: not-allowed;
        }

        /* Quiz Answer Buttons */
        .btn-answer { background-color: #ffffff; border: 3px solid #FECDD3; box-shadow: 0 6px 0 0 #FDA4AF; color: #9F1239; }
        .btn-answer:hover:not(:disabled) { background-color: #FFF1F2; }
        
        .btn-correct { background-color: #10B981 !important; border-color: #059669 !important; box-shadow: 0 6px 0 0 #047857 !important; color: white !important; }
        .btn-wrong { background-color: #F43F5E !important; border-color: #BE123C !important; box-shadow: 0 6px 0 0 #9F1239 !important; color: white !important; }

        /* Practice Card Container */
        .card-fun { 
            background-color: #ffffff; 
            border: 4px solid #FECDD3; 
            border-radius: 24px; 
            box-shadow: 0 8px 0 0 #FDA4AF; 
        }

        /* Custom scrollbar for the recap list */
        .scrollbar-custom::-webkit-scrollbar { width: 8px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #FFF1F2; border-radius: 10px; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #FDA4AF; border-radius: 10px; }

        /* Utilities */
        .hidden-view { display: none !important; }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateX(20px); } 
            to { opacity: 1; transform: translateX(0); } 
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 overflow-x-hidden">

    <!-- ========================================== -->
    <!-- VIEW 1: HOME (GRADE SELECTION)             -->
    <!-- ========================================== -->
    <div id="view-home" class="w-full max-w-md animate-slide-in">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-rose-600 tracking-tight uppercase flex items-center justify-center gap-3">
                🍿 TheoryPop
            </h1>
            <p class="text-sm font-bold text-rose-400 tracking-widest uppercase mt-4">Get practising on ABRSM theory</p>
        </div>

        <div class="flex flex-col gap-4">
            <!-- Active Grade -->
            <button onclick="selectGrade(1)" class="btn-3d btn-menu p-5 flex items-center justify-between group">
                <span class="text-xl font-black uppercase tracking-tight">Grade 1</span>
                <span class="text-xl font-black opacity-40 group-hover:translate-x-1 transition-transform">→</span>
            </button>
            
            <!-- Disabled Grades -->
            <button disabled class="btn-3d btn-disabled p-5 flex items-center justify-between">
                <span class="text-xl font-black uppercase tracking-tight">Grade 2</span>
                <span class="text-[10px] font-black uppercase tracking-widest bg-slate-200 text-slate-500 px-3 py-1.5 rounded-full">Coming Soon</span>
            </button>
            
            <button disabled class="btn-3d btn-disabled p-5 flex items-center justify-between">
                <span class="text-xl font-black uppercase tracking-tight">Grade 3</span>
                <span class="text-[10px] font-black uppercase tracking-widest bg-slate-200 text-slate-500 px-3 py-1.5 rounded-full">Coming Soon</span>
            </button>
        </div>

        <!-- Syllabus Link -->
        <div class="text-center mt-10">
            <a href="syllabus.html" class="inline-block text-sm font-bold text-rose-400 hover:text-rose-600 uppercase tracking-widest transition">
                View Full Syllabus →
            </a>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- VIEW 2: CHAPTER SELECTION                  -->
    <!-- ========================================== -->
    <div id="view-chapters" class="w-full max-w-md hidden-view animate-slide-in">
        <button onclick="showView('view-home')" class="mb-6 flex items-center text-rose-400 hover:text-rose-600 font-bold text-sm transition">
            <span class="mr-2 text-lg">←</span> Back to Grades
        </button>

        <div class="mb-8">
            <h1 id="chapter-title" class="text-4xl font-black text-rose-600 tracking-tight uppercase">Grade X</h1>
            <p class="text-sm font-bold text-rose-400 mt-1 tracking-widest uppercase">Choose a topic</p>
        </div>

        <div id="dynamic-chapters-list" class="flex flex-col gap-4">
            <!-- Buttons injected here -->
        </div>
    </div>


    <!-- ========================================== -->
    <!-- VIEW 3: ACTIVE QUIZ VIEW                   -->
    <!-- ========================================== -->
    <div id="view-practice" class="w-full max-w-md hidden-view animate-slide-in">
        
        <div class="flex justify-between items-center mb-6">
            <button onclick="showView('view-chapters')" class="text-rose-400 hover:text-rose-600 font-bold text-sm transition">
                ✕ Quit
            </button>
            <div class="text-sm font-black text-rose-400 uppercase tracking-widest" id="quiz-progress">1 / 12</div>
        </div>

        <div class="card-fun p-8 text-center flex flex-col items-center justify-center min-h-[250px] mb-6">
            <!-- Text layout aligned to exam paper style -->
            <div id="quiz-prompt" class="text-4xl font-black text-rose-600 tracking-tight leading-tight flex items-center justify-center min-h-[60px] italic">...</div>
            <p class="text-lg font-bold text-rose-400 uppercase tracking-widest mt-4">means:</p>
        </div>

        <!-- Multiple Choice Options -->
        <div id="quiz-options" class="grid grid-cols-1 gap-4">
            <!-- Buttons injected here -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 4: RESULTS VIEW                       -->
    <!-- ========================================== -->
    <div id="view-results" class="w-full max-w-md hidden-view animate-slide-in text-center">
        <div class="card-fun p-8 mb-8 mt-10">
            
            <div class="mb-8 mt-2">
                <p class="text-sm font-bold text-rose-400 uppercase tracking-widest mb-1">Your Score</p>
                <p id="result-score" class="text-5xl font-black text-rose-600">0 / 12</p>
                <p id="result-percent" class="text-xl font-bold text-rose-500 mt-2">0% Accuracy</p>
            </div>

            <!-- Recap Section -->
            <div class="text-left mb-8">
                <h3 class="text-sm font-black text-rose-400 uppercase tracking-widest mb-3 border-b-2 border-rose-100 pb-2">Round Recap</h3>
                <div id="results-recap" class="max-h-[30vh] overflow-y-auto pr-2 scrollbar-custom space-y-2">
                    <!-- Recap items injected here -->
                </div>
            </div>
            
            <button onclick="startPractice(currentTopic)" class="btn-3d btn-menu w-full p-4 mb-4 text-center uppercase tracking-widest font-black">
                Play Again ↺
            </button>
            
            <button onclick="showView('view-chapters')" class="w-full p-4 text-sm font-bold text-rose-400 hover:text-rose-600 uppercase tracking-widest">
                Back to Topics
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT APP LOGIC                       -->
    <!-- ========================================== -->
    <script src="data.js"></script>
    <script>
        // --- 1. DATA & STATE ---
        let currentGrade = null;
        let currentTopic = null;
        
        // Quiz State
        let quizPool = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let roundHistory = []; // Tracks the answers for the recap screen
        const totalQuestions = 12;

        // --- 2. NAVIGATION ---
        function showView(viewId) {
            document.getElementById('view-home').classList.add('hidden-view');
            document.getElementById('view-chapters').classList.add('hidden-view');
            document.getElementById('view-practice').classList.add('hidden-view');
            document.getElementById('view-results').classList.add('hidden-view');
            
            const activeView = document.getElementById(viewId);
            activeView.classList.remove('hidden-view');
            
            activeView.style.animation = 'none';
            activeView.offsetHeight; 
            activeView.style.animation = null; 
            window.scrollTo(0, 0);
        }

        function selectGrade(gradeNumber) {
            currentGrade = gradeNumber;
            document.getElementById('chapter-title').innerText = `Grade ${gradeNumber}`;
            
            const container = document.getElementById('dynamic-chapters-list');
            let html = '';
            
            syllabusChapters.forEach(topic => {
                if (topic.isReady) {
                    html += `
                    <button onclick="startPractice('${topic.title}')" class="btn-3d btn-menu p-5 flex items-center justify-between group">
                        <span class="text-lg font-black uppercase tracking-tight">${topic.title}</span>
                        <span class="text-rose-300 font-black group-hover:translate-x-1 transition-transform text-xl">→</span>
                    </button>`;
                } else {
                    html += `
                    <button disabled class="btn-3d btn-disabled p-5 flex items-center justify-between">
                        <span class="text-lg font-black uppercase tracking-tight">${topic.title}</span>
                        <span class="text-[10px] font-black uppercase tracking-widest bg-slate-200 text-slate-500 px-3 py-1.5 rounded-full">Coming Soon</span>
                    </button>`;
                }
            });

            container.innerHTML = html;
            showView('view-chapters');
        }

        // --- 3. QUIZ ENGINE ---
        function startPractice(topicName) {
            currentTopic = topicName;
            
            // Reset state
            quizPool = [...gradeOneVocab].sort(() => 0.5 - Math.random()).slice(0, totalQuestions);
            currentQuestionIndex = 0;
            score = 0;
            roundHistory = [];
            
            showView('view-practice');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                showResults();
                return;
            }

            const currentQ = quizPool[currentQuestionIndex];
            
            document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / ${totalQuestions}`;
            document.getElementById('quiz-prompt').innerHTML = currentQ.term; // using innerHTML to render SVGs

            let incorrectAnswers = gradeOneVocab
                .filter(v => v.answer !== currentQ.answer)
                .map(v => v.answer)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);
                
            let options = [...incorrectAnswers, currentQ.answer].sort(() => 0.5 - Math.random());

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = options.map(opt => `
                <button onclick="checkAnswer(this, '${escape(opt) === escape(currentQ.answer)}')" class="btn-3d btn-answer w-full p-4 text-left text-base font-bold">
                    ${opt}
                </button>
            `).join('');
        }

        function checkAnswer(btnElement, isCorrectString) {
            const isCorrect = isCorrectString === 'true';
            const allBtns = document.getElementById('quiz-options').querySelectorAll('button');
            const currentQ = quizPool[currentQuestionIndex];

            // Save to history for recap
            roundHistory.push({
                term: currentQ.term,
                answer: currentQ.answer,
                isCorrect: isCorrect
            });
            
            allBtns.forEach(b => {
                b.disabled = true;
                if(b.innerText.trim() === currentQ.answer.trim() && !isCorrect) {
                    b.classList.add('btn-correct');
                    b.style.opacity = '0.5';
                }
            });

            if (isCorrect) {
                btnElement.classList.add('btn-correct');
                score++;
            } else {
                btnElement.classList.add('btn-wrong');
            }

            setTimeout(() => {
                currentQuestionIndex++;
                loadNextQuestion();
            }, 1200);
        }

        // --- 4. RESULTS & RECAP ---
        function showResults() {
            document.getElementById('result-score').innerText = `${score} / ${totalQuestions}`;
            const accuracy = Math.round((score / totalQuestions) * 100);
            document.getElementById('result-percent').innerText = `${accuracy}% Accuracy`;
            
            // Build the Recap List
            const recapContainer = document.getElementById('results-recap');
            let recapHtml = '';
            
            roundHistory.forEach(item => {
                const icon = item.isCorrect 
                    ? '<span class="text-emerald-500 font-bold text-lg">✓</span>' 
                    : '<span class="text-rose-500 font-bold text-lg">✗</span>';
                
                const answerColorClass = item.isCorrect ? 'text-slate-600' : 'text-rose-600';
                
                // Using nested CSS to ensure SVG signs fit neatly in the recap list
                recapHtml += `
                    <div class="flex items-center justify-between bg-rose-50/50 p-3 rounded-xl border border-rose-100">
                        <div class="flex items-center gap-3 w-1/2">
                            ${icon}
                            <div class="font-bold text-rose-900 text-sm flex items-center [&>svg]:max-h-6 [&>svg]:w-auto [&>div]:max-h-6 overflow-hidden">
                                ${item.term}
                            </div>
                        </div>
                        <div class="text-xs font-bold ${answerColorClass} text-right w-1/2">
                            ${item.answer}
                        </div>
                    </div>
                `;
            });
            
            recapContainer.innerHTML = recapHtml;

            showView('view-results');
        }
    </script>
</body>
</html>
